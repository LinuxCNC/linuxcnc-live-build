d-i passwd/root-login boolean false
d-i passwd/user-default-groups string audio cdrom video dialout uinput
d-i apt-setup/use_mirror boolean true

# Mirror Settings (Corrected Types and Protocol added)
d-i apt-setup/use_mirror boolean true
d-i mirror/protocol select http
d-i mirror/country select enter information manually
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian

# Explicitly stop the installer from writing CD/DVD repositories
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false

# Setting below overwrite settings in config file 
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i firmware-ipw2x00/license/accepted boolean true
